name: public-demo-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse public knowledge JSON and verify mirror sync
        run: python tools/knowledge_sync.py check

      - name: Run public showcase static checks
        run: python tools/public_demo_check.py
